name: Compilar CrewX para OneClient

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crewx-oneclient-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            *.gradle.kts
            gradle/wrapper/gradle-wrapper.properties
      - name: Configurar JDK 8 para o projeto
        shell: pwsh
        run: |
          Add-Content gradle.properties "`norg.gradle.java.installations.paths=$($env:JAVA_HOME_8_X64.Replace('\','/'))"
      - name: Gerar e verificar mappings Ornithe
        shell: pwsh
        run: |
          New-Item -ItemType Directory build-tools -Force | Out-Null
          javac -proc:none -d build-tools tools/GenerateOrnitheSrg.java tools/OrnitheMappingRegressionTest.java
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao compilar ferramentas de mappings' }
          java -cp build-tools GenerateOrnitheSrg src/main/resources/crewx/inject/notch-joined.srg src/main/resources/crewx/inject/ornithe-intermediary.tiny src/main/resources/crewx/inject/ornithe-joined.srg
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao gerar mappings' }
          java -cp build-tools OrnitheMappingRegressionTest src/main/resources/crewx/inject
          if ($LASTEXITCODE -ne 0) { throw 'Falha no teste de mappings' }
      - name: Preparar hierarquia e documento de mappings
        shell: python
        run: |
          import hashlib, json, pathlib, urllib.request
          root = pathlib.Path('.')
          resources = root / 'src/main/resources/crewx/inject'
          path = resources / 'mappings.json'
          document = json.loads(path.read_text(encoding='utf-8'))
          document['profiles']['ornithe']['resources']['ornithe-joined.srg'] = (resources / 'ornithe-joined.srg').read_text(encoding='utf-8')
          path.write_text(json.dumps(document), encoding='utf-8')
          metadata_url = 'https://piston-meta.mojang.com/v1/packages/d546f1707a3f2b7d034eece5ea2e311eda875787/1.8.9.json'
          with urllib.request.urlopen(metadata_url, timeout=60) as response:
              metadata = json.load(response)
          client = metadata['downloads']['client']
          with urllib.request.urlopen(client['url'], timeout=120) as response:
              data = response.read()
          expected = '3870888a6c3d349d3771a3e9d16c9bf5e076b908'
          assert client['sha1'] == expected and hashlib.sha1(data).hexdigest() == expected
          (root / 'build-tools/vanilla-1.8.9.jar').write_bytes(data)
      - name: Executar testes Java
        shell: pwsh
        run: |
          .\gradlew.bat test --no-daemon
          if ($LASTEXITCODE -ne 0) { throw 'Falha nos testes Java' }
      - name: Compilar executável Windows x64
        shell: pwsh
        run: |
          .\Build-Injector.ps1 -Jdk17 $env:JAVA_HOME_17_X64 -Jdk8 $env:JAVA_HOME_8_X64 -OneClientGame build-tools/vanilla-1.8.9.jar
      - name: Verificar referências do payload
        shell: pwsh
        run: |
          python tools/check_oneclient_payload.py build/libs/CrewX-inject-ornithe.jar build-tools/vanilla-1.8.9.jar src/main/resources/crewx/inject --report build-tools/oneclient-linkage.txt
          if ($LASTEXITCODE -ne 0) { throw 'Referências não resolvidas no payload OneClient' }
          Get-FileHash dist/CrewXInjector.exe -Algorithm SHA256 | Format-List | Out-File dist/SHA256.txt
      - name: Publicar snapshot validado de mappings
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/crewx/inject/ornithe-joined.srg src/main/resources/crewx/inject/mappings.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m "Atualizar snapshot validado dos mappings OneClient [skip ci]"
            if ($LASTEXITCODE -ne 0) { throw 'Falha ao salvar snapshot' }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'A branch mudou durante a compilação; não foi sobrescrita' }
          } elseif ($LASTEXITCODE -ne 0) { throw 'Falha ao verificar snapshot' }
          $sourceRevision = git rev-parse HEAD
          "CREWX_SOURCE_REVISION=$sourceRevision" >> $env:GITHUB_ENV
      - name: Disponibilizar executável e documentação
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: CrewX-OneClient-Windows-x64
          path: |
            dist/*
            build-tools/oneclient-linkage.txt
            README.md
            docs/
          if-no-files-found: error
      - name: Salvar relatórios dos testes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: CrewX-OneClient-build-diagnostics
          path: |
            build/reports/tests/
            build/test-results/
            build-tools/oneclient-linkage.txt
          if-no-files-found: ignore
      - name: Publicar versão de teste para download
        if: success() && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "oneclient-v$version"
          $releaseTags = gh release list --json tagName --jq '.[].tagName'
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao consultar versões' }
          if ($releaseTags -contains $tag) {
            Write-Host "A versão $tag já existe; a nova compilação fica disponível nos artefatos."
          } else {
            gh release create $tag dist/CrewXInjector.exe dist/SHA256.txt --target $env:CREWX_SOURCE_REVISION --title "CrewX para OneClient $version — versão de teste" --notes-file docs/NOTAS-DA-VERSAO.md --prerelease
            if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar versão de teste' }
          }
